<style>
:root {
  /* Layout idea: a late-night desk scene as the hero (records, turntable, retro computer, lamp), then a quiet single-column page lit by the same lamp. */

  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--ink); color: var(--paper); font: 400 17px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
a { color: var(--paper); text-decoration-color: var(--lamp); text-underline-offset: 3px; }
a:hover { color: var(--lamp); }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; border-radius: 2px; }

.nav { position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; gap: 16px;
  padding: 14px clamp(16px, 4vw, 48px); background: rgba(14,22,38,.82); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
.nav .mark { font: 600 19px/1 var(--display); letter-spacing: .04em; text-decoration: none; }

.intro { max-width: 1100px; margin: 0 auto; padding: clamp(40px, 7vw, 88px) clamp(16px, 4vw, 48px) 28px; }
.intro h1 { font: 600 clamp(40px, 6.4vw, 76px)/1.08 var(--display); letter-spacing: .01em; margin: 0 0 18px; text-wrap: balance; }

/* ---------- desk scene: a path-traced 3D render with live overlays ---------- */
.scene-wrap { max-width: 1100px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px); }
.stage { --label: #c8553d; position: relative; width: 100%; aspect-ratio: 16 / 10; container-type: inline-size; border-radius: 14px; overflow: hidden;
  background: #0b1222; box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 0 0 1px var(--rule); }
.stage > * { position: absolute; }
#city { display: block; }
.sky { object-fit: cover; object-position: 50% 42%; filter: blur(.2cqw) brightness(.98) saturate(.95); }
.shot { inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; user-select: none; }
.shot.off { opacity: 0; transition: opacity .5s ease; }
.stage.lamp-off .shot.off { opacity: 1; }
.lab { aspect-ratio: 1; transform: translateY(-50%) scaleY(var(--k)); mix-blend-mode: multiply; pointer-events: none; transition: opacity .25s; }
.lab i { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, #222 0 6%, transparent 7%), linear-gradient(90deg, var(--label) 0 50%, #e9e2cf 50%); animation: spin 1.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.stage.paused .lab i { animation-play-state: paused; }
.stage.swap .lab { opacity: 0; }
.crt { overflow: hidden; border-radius: .7cqw; text-shadow: 0 0 .5cqw rgba(60,220,255,.75); }
.crt::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(rgba(0,0,0,.22) 0 1px, transparent 1px 3px); }
.menubar { display: flex; justify-content: space-between; white-space: nowrap; overflow: hidden; height: 2cqw; padding: 0 .8cqw; font: 400 1.6cqw/2cqw var(--crt); color: #9ff6ff; border-bottom: 1px solid rgba(127,246,255,.55); }
.crt pre { margin: 0; padding: .5cqw .8cqw; font: 400 1.36cqw/1.3 var(--crt); color: #45c4d6; white-space: pre; overflow: hidden; }
.crt pre b { color: #d6fdff; font-weight: 400; }
.crt.static pre { opacity: 0; }
.crt.static { background: repeating-radial-gradient(circle at 30% 40%, #b8c2bd 0 1px, #3b4542 1px 2px, #8a9590 2px 3px); animation: hiss .12s steps(3) infinite; }
@keyframes hiss { 33% { background-position: 3px 1px; } 66% { background-position: -2px 2px; } }
@keyframes blink { 50% { opacity: 0; } }
.cursor { display: inline-block; width: .75cqw; height: 1.35cqw; background: #9ff6ff; box-shadow: 0 0 .6cqw rgba(60,220,255,.9); vertical-align: -.15cqw; animation: blink 1s steps(1) infinite; }
.sleeve { all: unset; position: absolute; box-sizing: border-box; cursor: pointer; border-radius: .15cqw; transition: backdrop-filter .15s; }
.sleeve:hover, .sleeve:focus-visible { -webkit-backdrop-filter: brightness(1.35); backdrop-filter: brightness(1.35); }
.sleeve:focus-visible { outline: 2px solid var(--lamp); outline-offset: 1px; }
.sleeve[aria-pressed="true"]::before { content: ""; position: absolute; left: 50%; top: -1.5cqw; margin-left: -.5cqw; border: .5cqw solid transparent; border-top: .7cqw solid var(--lamp); filter: drop-shadow(0 0 .4cqw rgba(240,177,92,.8)); }
.lamp { all: unset; position: absolute; cursor: pointer; border-radius: 50%; }
.lamp:hover { background: radial-gradient(closest-side, rgba(255,214,140,.16), transparent); }
.lamp:focus-visible { outline: 2px solid var(--lamp); }
.steam { width: 2cqw; height: 4.4cqw; transform: translate(-50%, -100%); pointer-events: none; }
.steam i { position: absolute; bottom: 0; width: .3cqw; height: 100%; border-radius: 1cqw; background: linear-gradient(transparent, rgba(237,228,208,.3)); animation: rise 3.6s ease-in-out infinite; }
.steam i:nth-child(2) { left: 1.1cqw; animation-delay: 1.2s; }
@keyframes rise { 0% { transform: translateY(20%) scaleY(.6); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateY(-40%) scaleY(1.1) skewX(10deg); opacity: 0; } }
.hint { left: 1.6%; top: 2.4%; font: 400 1.05cqw/1.3 var(--mono); color: rgba(237,228,208,.6); text-align: left; }
.caption { display: flex; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin: 12px 2px 0; font: 400 13px/1.5 var(--mono); color: var(--muted); }
.caption button { all: unset; cursor: pointer; color: var(--paper); text-decoration: underline; text-decoration-color: var(--lamp); text-underline-offset: 3px; }

/* ---------- sections ---------- */
main { max-width: 1100px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px); }
section { padding: clamp(56px, 8vw, 96px) 0 8px; scroll-margin-top: 64px; }
.sec-head { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 24px 48px; align-items: baseline; border-top: 1px solid var(--rule); padding-top: 22px; }
.sec-head .k { font: 400 13px/1.4 var(--mono); color: var(--lamp); letter-spacing: .06em; text-transform: uppercase; }
.sec-head h2 { font: 600 clamp(27px, 3.8vw, 42px)/1.15 var(--display); letter-spacing: .01em; margin: 0; text-wrap: balance; }
.body { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 24px 48px; margin-top: 28px; }
.body > .side { font: 400 13px/1.6 var(--mono); color: var(--muted); }
.fill { background: rgba(240,177,92,.14); border-bottom: 1px dashed var(--lamp); padding: 0 .2em; color: var(--paper); }

.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px 24px; padding: 16px 0; border-bottom: 1px solid var(--rule); }
.rows li:first-child { border-top: 1px solid var(--rule); }
.rows .y { font: 400 14px/1.7 var(--mono); color: var(--lamp); font-variant-numeric: tabular-nums; }
.rows .t { font: 500 21px/1.35 var(--display); }
.rows .d { color: var(--muted); font-size: 15.5px; }

.papers { display: grid; gap: 18px; }
.paper { display: grid; grid-template-columns: 14px minmax(0, 1fr); background: var(--ink-2); border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--rule); }
.paper .spine { background: var(--red); }
.paper.blue .spine { background: #4f7cac; }
.paper.amber .spine { background: var(--lamp); }
.paper .in { padding: 20px 24px 22px; }
.paper .meta { font: 400 12.5px/1.4 var(--mono); color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .05em; }
.paper h3 { font: 500 22px/1.3 var(--display); margin: 0 0 8px; text-wrap: balance; }
.paper p { margin: 0; color: #cfc6b3; max-width: 66ch; }
.paper .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.paper .tags span { font: 400 12px/1 var(--mono); padding: 6px 8px; border-radius: 4px; background: rgba(237,228,208,.07); color: var(--muted); }

.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.card { background: var(--ink-2); border-radius: 8px; padding: 20px 22px; box-shadow: inset 0 0 0 1px var(--rule); }
.card h3 { font: 500 22px/1.3 var(--display); margin: 0 0 6px; }
.card p { margin: 0; color: #cfc6b3; font-size: 15.5px; }
.card .k { font: 400 12px/1 var(--mono); color: var(--lamp); text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 10px; }

footer { max-width: 1100px; margin: 88px auto 0; padding: 26px clamp(16px, 4vw, 48px) 48px; border-top: 1px solid var(--rule);
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font: 400 13px/1.6 var(--mono); color: var(--muted); }

@media (max-width: 860px) { .grid3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .sec-head, .body { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .rows li { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .steam i, .cursor, .crt.static, .lab i { animation: none; } }

/* ---------- one-screen layout: the room is the site ---------- */
html, body { height: 100%; overflow: hidden; }
.nav { position: fixed; left: 0; right: 0; top: 0; z-index: 20; background: linear-gradient(rgba(8,12,24,.82), rgba(8,12,24,0)); border: 0; -webkit-backdrop-filter: none; backdrop-filter: none; padding-bottom: 28px; }

.stage { position: fixed; inset: 0; width: auto; aspect-ratio: auto; border-radius: 0; box-shadow: none; background: #0a0f1c; }
.shot { object-fit: cover; }
#gl { inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity .7s ease; touch-action: none; cursor: grab; }

.hud { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding: 30px clamp(16px, 4vw, 48px) 14px;
  font: 400 13px/1.5 var(--mono); color: var(--paper); background: linear-gradient(rgba(8,12,24,0), rgba(8,12,24,.85)); pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud button { all: unset; cursor: pointer; text-decoration: underline; text-decoration-color: var(--lamp); text-underline-offset: 3px; }
.hud .msg { color: var(--muted); }
.veil { position: fixed; inset: 0; z-index: 40; display: none; place-items: center; overflow: hidden; background: rgba(6,9,18,0); -webkit-backdrop-filter: blur(14px) brightness(1.22); backdrop-filter: blur(14px) brightness(1.22); }
.veil.open { display: grid; }
.veil > .sleeve2, .veil > .platter { grid-area: 1 / 1; }
.sleeve2 { --c: #c8553d; --on: #fff3df; position: relative; z-index: 2; width: min(66vh, 84vw, 560px); aspect-ratio: 1; background: var(--c); color: var(--on); border-radius: 4px; overflow: hidden;
  padding: 5% 6%; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 30px 70px rgba(0,0,0,.55); pointer-events: none; }
.sleeve2::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, rgba(255,255,255,.16), transparent 32%, rgba(0,0,0,.2)); }
.sleeve2 .k { font: 500 12.5px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; display: flex; justify-content: space-between; }
.sleeve2 .words { flex: 1; display: flex; flex-direction: column; justify-content: center; overflow: hidden; font: 600 80px/.92 var(--display); letter-spacing: -.01em; white-space: nowrap; }
.sleeve2 .words span { display: block; color: transparent; -webkit-text-stroke: 1.5px var(--on); opacity: .6; }
.sleeve2 .words span.solid { color: var(--on); -webkit-text-stroke: 0; opacity: 1; }
.sleeve2 .by { font: 400 12.5px/1.4 var(--mono); letter-spacing: .06em; opacity: .9; }
.platter { --c: #c8553d; --d: min(90vh, 900px); position: relative; z-index: 1; width: var(--d); height: var(--d); flex: none; border-radius: 50%;
  background: conic-gradient(from 25deg, transparent 0 7%, rgba(255,255,255,.12) 12%, transparent 17% 53%, rgba(255,255,255,.09) 60%, transparent 66%), repeating-radial-gradient(circle, #101014 0 2px, #1c1c23 2px 4px);
  box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 2px #2a2a33; }
.label { position: absolute; inset: 7.5%; border-radius: 50%; background: #f2ead7; box-shadow: inset 0 0 0 10px var(--c), inset 0 0 0 12px rgba(35,28,20,.35), 0 0 0 3px #08080b; overflow: hidden; }
.label::before { content: ""; position: absolute; left: 50%; top: 50%; width: 3.2%; height: 3.2%; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(35,28,20,.09); }
.notes { --paper: #231c14; --muted: #6b6252; --rule: rgba(35,28,20,.16); --ink-2: #e7ddc6; --lamp: #a2511a; position: absolute; left: 15%; right: 15%; top: 9%; bottom: 9%; overflow-y: auto; color: #231c14; padding: 7% 2px 9%;
  -webkit-mask-image: linear-gradient(transparent, #000 9%, #000 89%, transparent); mask-image: linear-gradient(transparent, #000 9%, #000 89%, transparent); scrollbar-width: thin; }
.notes .lh { text-align: center; font: 500 12px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
.notes h2 { text-align: center; margin: 0 0 18px; font: 600 clamp(22px, 2.6vw, 30px)/1.1 var(--display); }
.notes .body { display: block; margin-top: 0; }
.notes .body + .body { margin-top: 22px; }
.notes .side { margin-bottom: 10px; text-align: center; }
.notes .side br + br { display: none; }
.notes .lead p { font-size: 16.5px; margin: 0 0 16px; }
.notes .lead strong { font-weight: 600; }
.notes .contact { margin: 16px 0 0; font: 400 13px/1.5 var(--mono); text-align: center; overflow-wrap: anywhere; }
.notes a { color: #231c14; }
.notes .rows li { grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 12px 0; }

.notes .paper .tags span { background: rgba(35,28,20,.07); }
.notes .card { box-shadow: inset 0 0 0 1px var(--rule); padding: 14px 16px; }
.notes .card h3 { font-size: 19px; }
.notes .grid3 { grid-template-columns: minmax(0, 1fr); gap: 12px; }
.x { all: unset; position: fixed; right: clamp(14px, 3vw, 40px); top: clamp(14px, 3vh, 32px); z-index: 3; width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer; border-radius: 50%;
  font: 400 26px/1 var(--body); color: #231c14; background: #f2ead7; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.x:hover { background: #fff; }
.x:focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; }
.hov { position: fixed; z-index: 25; pointer-events: none; padding: 4px 9px; border-radius: 4px; background: rgba(8,12,24,.85); color: var(--paper); font: 400 12.5px/1.4 var(--mono); opacity: 0; transition: opacity .15s; white-space: nowrap; }
.hov.on { opacity: 1; }
.tip { position: fixed; z-index: 26; width: min(300px, calc(100vw - 24px)); padding: 14px 16px; border-radius: 8px; background: #f2ead7; color: #231c14; box-shadow: 0 16px 40px rgba(0,0,0,.45); font: 400 15px/1.5 var(--body);
  opacity: 0; transform: translateY(8px) scale(.97); pointer-events: none; transition: opacity .2s, transform .25s cubic-bezier(.2,.8,.2,1); }
.tip.on { opacity: 1; transform: none; pointer-events: auto; }

.tip span.q { font: 500 19px/1.3 var(--display); text-wrap: balance; }

.tip em { display: block; margin-top: 6px; font: 400 13px/1.4 var(--mono); font-style: normal; color: #6b6252; }
.tip button { all: unset; cursor: pointer; margin-top: 10px; font: 500 13px/1 var(--mono); text-decoration: underline; text-decoration-color: #a2511a; text-underline-offset: 3px; }
.tip button:focus-visible { outline: 2px solid #231c14; outline-offset: 3px; }
.term { position: fixed; z-index: 22; display: none; flex-direction: column; padding: .5em .8em; overflow: hidden; font-family: var(--crt); line-height: 1.12; color: #7fe9f7; text-shadow: 0 0 .5em rgba(60,220,255,.7); border-radius: .5em; }

<template id="card-1"><div class="lead"><p>I'm an applied microeconomist at the <strong>Li Anmin Institute of Economics Research, Liaoning University</strong>. I work on labor and urban economics: how workers and jobs find each other, what cities add to that, and why the market for your major matters.</p></div>
<div class="body">
      <div class="side">Where I work now.</div>
      <ul class="rows">

            <h3>The Benefits of Major-related Labor Markets for Job Match Quality of College Graduates</h3>
            <p>This paper examines how major-specific labor-market thickness relates to college graduates' job-match quality. Using the 2010–2019 American Community Survey across 290 U.S. metropolitan areas, it distinguishes the size of major-related labor markets from aggregate city size. The analysis considers skill-space dilution, shift-share estimates, and the relationship between job matching and wages.</p>

            <p>This paper studies educational and occupational matching among highly educated, dual-career couples in local labor markets. It examines whether access to larger major-related labor markets is associated with better job-match quality for husbands and wives, distinguishing major-specific market size from overall urban population.</p>

<script>
(() => {
  const CARDS = [{"hash": "hello", "title": "Hello", "side": "Side 01", "color": "#c8553d"}, {"hash": "education", "title": "Education", "side": "Side 02", "color": "#4f7cac"}, {"hash": "research", "title": "Working papers", "side": "Side 03", "color": "#f0b15c"}, {"hash": "teaching", "title": "Classes I teach", "side": "Side 04", "color": "#6aa37c"}, {"hash": "life", "title": "Off the clock", "side": "Side 05", "color": "#9b6fb0"}];
  const veil = document.getElementById('veil'), body = document.getElementById('gbody'), sleeve = document.getElementById('sleeve'), platter = document.getElementById('platter'),
    notes = document.getElementById('notes'), words = document.getElementById('words');
  const WORD = ['HELLO', 'EDUCATION', 'RESEARCH', 'TEACHING', 'LIFE'];
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches, OUT = 'cubic-bezier(.2,.8,.2,1)', INOUT = 'cubic-bezier(.65,0,.35,1)', IN = 'cubic-bezier(.5,0,.75,.4)';
  let lastFocus = null, anims = [], cur = 0, closing = false;
  const stop = () => { anims.forEach(a => a.cancel()); anims = []; };
  function fillCover(n) {
    const w = WORD[n - 1]; words.style.fontSize = '100px'; words.innerHTML = '<span>' + w + '</span>';
    const fs = Math.max(28, Math.floor(100 * (words.clientWidth - 2) / words.firstChild.scrollWidth));
    const rows = Math.max(3, Math.min(7, Math.floor(words.clientHeight / (fs * .92))));
    words.style.fontSize = fs + 'px';
    words.innerHTML = Array.from({ length: rows }, (_, i) => '<span' + (i === Math.floor((rows - 1) / 2) ? ' class="solid"' : '') + '>' + w + '</span>').join('');
  }
  function geo(n) {
    const c = sleeve.getBoundingClientRect(), S = c.width, s0 = S * .94 / platter.offsetWidth;
    const p = (window.recordScreenPos && window.recordScreenPos(n)) || { x: innerWidth / 2, y: innerHeight * .8, w: S * .25 };
    return { S, s0, far: `translate(${p.x - (c.left + S / 2)}px, ${p.y - (c.top + S / 2)}px) scale(${Math.max(.08, Math.min(.6, p.w / S))}) rotate(-7deg)`,
      away: `translateX(${-(innerWidth / 2 + S)}px) rotate(-16deg)`, tucked: `translateX(0px) scale(${s0}) rotate(0deg)`, pulled: `translateX(${S * .56}px) scale(${s0}) rotate(200deg)` };
  }
  /* open: the sleeve flies out of the rack, the record is pulled out to the right, the sleeve slides off to the left, the record settles in the middle */
  function animIn(n) {
    stop(); if (RM || !sleeve.animate) { sleeve.style.visibility = 'hidden'; return; }
    sleeve.style.visibility = ''; const o = geo(n);
    anims.push(veil.animate([{ backgroundColor: 'rgba(6,9,18,0)' }, { backgroundColor: 'rgba(6,9,18,0)' }], { duration: 500, easing: 'ease-out' }));
    anims.push(sleeve.animate([
      { transform: o.far, opacity: 0, easing: OUT }, { opacity: 1, offset: .05 }, { transform: 'none', offset: .34, easing: 'linear' },
      { transform: 'none', offset: .66, easing: IN }, { transform: o.away, opacity: 1 }], { duration: 1750, fill: 'forwards' }));
    anims.push(platter.animate([
      { transform: o.tucked, opacity: 0 }, { transform: o.tucked, opacity: 0, offset: .30 }, { transform: o.tucked, opacity: 1, offset: .33, easing: INOUT },
      { transform: o.pulled, opacity: 1, offset: .62, easing: INOUT }, { transform: 'translateX(0px) scale(1) rotate(360deg)', opacity: 1 }], { duration: 1900 }));
    anims.push(notes.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 380, delay: 1650, fill: 'backwards', easing: 'ease-out' }));
    anims.push(document.getElementById('gx').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 1650, fill: 'backwards' }));
  }
  /* close: the sleeve comes back from the left, the record slides in, the sleeve flies home to the rack */
  function animOut(n, done) {
    stop(); if (RM || !sleeve.animate) return done();
    sleeve.style.visibility = ''; const o = geo(n);
    anims.push(notes.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' }));
    anims.push(document.getElementById('gx').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' }));
    anims.push(platter.animate([
      { transform: 'translateX(0px) scale(1) rotate(0deg)', opacity: 1, easing: INOUT }, { transform: o.pulled.replace('200deg', '-160deg'), opacity: 1, offset: .40, easing: 'linear' },
      { transform: o.pulled.replace('200deg', '-160deg'), opacity: 1, offset: .52, easing: INOUT }, { transform: o.tucked.replace('0deg', '-360deg'), opacity: 1, offset: .76 },
      { transform: o.tucked.replace('0deg', '-360deg'), opacity: 0, offset: .78 }, { transform: o.tucked.replace('0deg', '-360deg'), opacity: 0 }], { duration: 1500, fill: 'forwards' }));
    const fly = sleeve.animate([
      { transform: o.away, opacity: 1 }, { transform: o.away, opacity: 1, offset: .16, easing: OUT }, { transform: 'none', opacity: 1, offset: .50, easing: 'linear' },
      { transform: 'none', opacity: 1, offset: .78, easing: IN }, { opacity: 1, offset: .96 }, { transform: o.far, opacity: 0 }], { duration: 1500, fill: 'forwards' });
    anims.push(veil.animate([{ backgroundColor: 'rgba(6,9,18,0)' }, { backgroundColor: 'rgba(6,9,18,0)' }], { duration: 400, delay: 1100, fill: 'forwards' }));
    anims.push(fly); fly.onfinish = done;
  }
  function show(n) {
    const c = CARDS[n - 1]; if (!c) return;
    stop(); closing = false; cur = n;
    for (const el of [sleeve, platter]) { el.style.setProperty('--c', c.color); el.style.setProperty('--on', n === 3 ? '#231c14' : '#fff3df'); }
    document.getElementById('gs').textContent = c.side; document.getElementById('ss').textContent = c.side; document.getElementById('gt').textContent = c.title;
    body.replaceChildren(document.getElementById('card-' + n).content.cloneNode(true));
    if (!veil.classList.contains('open')) lastFocus = document.activeElement;
    veil.classList.add('open'); notes.scrollTop = 0; fillCover(n); animIn(n); if (window.sfx) { window.sfx.whoosh(); setTimeout(window.sfx.thump, 620); }
    document.getElementById('gx').focus({ preventScroll: true });
    if (window.playRecord) window.playRecord(n); else window.__pending = n;
  }
  function hide() {
    if (!veil.classList.contains('open') || closing) return; closing = true;
    animOut(cur, () => { if (!closing) return; closing = false; veil.classList.remove('open'); stop(); if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true }); });
  }
  function route() { const h = location.hash.replace('#', ''); const i = CARDS.findIndex(c => c.hash === h); if (i >= 0) show(i + 1); else hide(); }
  window.openRecord = n => { const h = '#' + CARDS[n - 1].hash; if (location.hash === h) show(n); else location.hash = h; };
  const close = () => { if (location.hash && location.hash !== '#') location.hash = ''; else hide(); };
  document.getElementById('gx').addEventListener('click', close);
  veil.addEventListener('click', e => { if (e.target === veil) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && veil.classList.contains('open')) close(); });
  window.addEventListener('hashchange', route); route();
})();
</script>
